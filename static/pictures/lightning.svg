<?xml version="1.0" encoding="UTF-8"?>
<svg
    width="400"
    height="400"
    viewBox="0 0 400 400"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <!-- Glühender Blur -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Blitz-Gradient -->
        <linearGradient id="boltGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="50%" stop-color="#9fdcff"/>
            <stop offset="100%" stop-color="#2aa8ff"/>
        </linearGradient>
    </defs>

    <!-- Blitz -->
    <path
        d="
        M210 20
        L160 160
        L210 160
        L140 320
        L240 180
        L190 180
        Z
        "
        fill="url(#boltGradient)"
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linejoin="round"
    />
</svg>
