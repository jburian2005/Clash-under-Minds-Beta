{% extends "base.html" %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles_multiplayer.css') }}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
{% endblock %}

{% block body %}
<div class="multiplayer-page">
    <div class="header-controls">
        <a href="{{ url_for('multiplayer_menu') }}" class="back-button sound-button">
            <i class="fas fa-arrow-left"></i>
        </a>
    </div>

    <div class="glass-card layout-card">
        <div class="room-header">
            <h1>{{ room.name }}</h1>
            {% if room.is_private %}
                <div class="code-badge">EINLADUNGSCODE: {{ room.code }}</div>
            {% endif %}
        </div>

        <div class="game-content">
            <div class="player-sidebar">
                <h3>Crew-Mitglieder</h3>
                <ul id="activePlayers">
                    <li><i class="fas fa-user-astronaut"></i> {{ room.host.username }} (Host)</li>
                </ul>
            </div>
            
            <div class="main-play-area">
                <p>Warte auf Spielstart...</p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<script>
    const socket = io();
    const roomId = "{{ room.id }}";

    socket.emit('join_multiplayer_room', { room_id: roomId });

    socket.on('status', function(data) {
        const list = document.getElementById('activePlayers');
        const li = document.createElement('li');
        li.innerHTML = `<i class="fas fa-user-astronaut"></i> ${data.msg}`;
        list.appendChild(li);
    });
</script>
{% endblock %}
